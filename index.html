<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<title>Jarvis</title>
<style>
  :root { --c:#00e5ff; --bg:#02070d; --dim:#0a2a36; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: linear-gradient(rgba(0,229,255,.045) 1px, transparent 1px) 0 0/34px 34px, linear-gradient(90deg, rgba(0,229,255,.045) 1px, transparent 1px) 0 0/34px 34px, radial-gradient(circle at 50% 30%, #07202c, var(--bg)); color: var(--c);
         font-family: -apple-system, Helvetica, Arial, sans-serif; display: flex; flex-direction: column;
         padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
  h1 { text-shadow: 0 0 14px var(--c), 0 0 32px rgba(0,229,255,.5); text-align: center; letter-spacing: 8px; font-weight: 300; margin: 14px 0 4px; }
  #status { text-align: center; font-size: 13px; opacity: .7; min-height: 18px; }
  #orb { width: 100%; height: 230px; display: block; flex: none; }
  #log { background: rgba(2,12,18,.55); box-shadow: inset 0 0 24px rgba(0,229,255,.08); flex: 1; overflow-y: auto; padding: 8px; border: 1px solid var(--dim); border-radius: 12px; font-size: 16px; }
  .me { color: #9fb; margin: 8px 0; text-align: right; }
  .ai { color: var(--c); margin: 8px 0; }
  #bar { display: flex; gap: 8px; margin: 10px 0; }
  input, button { font-size: 17px; border-radius: 10px; border: 1px solid var(--c); background: #041a24; color: var(--c); padding: 12px; }
  #txt { flex: 1; min-width: 0; }
  button:active { background: var(--c); color: #000; }
  #mic.on, #ear.on { background: var(--c); color: #000; }
  #cfg { display: none; padding: 10px; border: 1px solid var(--dim); border-radius: 12px; margin-bottom: 8px; }
  #cfg input { width: 100%; margin: 4px 0 8px; }
  small { opacity: .6; }
  a.lnk { display: inline-block; margin: 4px 0; padding: 10px 14px; border: 1px solid var(--c); border-radius: 10px; color: var(--c); text-decoration: none; background: #041a24; }
  select { width: 100%; margin: 4px 0 8px; font-size: 17px; border-radius: 10px; border: 1px solid var(--c); background: #041a24; color: var(--c); padding: 12px; }
  input[type=range] { padding: 0; }
</style>
</head>
<body>
<h1>JARVIS</h1>
<div id="status">Pronto</div>
<canvas id="orb"></canvas>

<div id="cfg">
  <small>Chiave API Gemini (resta solo su questo iPad)</small>
  <input id="key" type="password" placeholder="Incolla qui la chiave">
  <small>Modello</small>
  <input id="model" value="gemini-2.5-flash-lite">
  <small>Grafica</small>
  <select id="gstyle"><option value="circle">Cerchio</option><option value="hud">HUD da casco</option><option value="neural">Rete neurale</option><option value="combo">HUD e rete</option></select>
  <small>Motore voce</small>
  <select id="engine"><option value="browser">iOS (integrata)</option><option value="gemini">Gemini (naturale)</option></select>
  <small>Voce Gemini</small>
  <select id="gvoice"><option>Charon</option><option>Orus</option><option>Fenrir</option><option>Algenib</option><option>Iapetus</option><option>Enceladus</option><option>Puck</option></select>
  <small>Modello voce Gemini</small>
  <input id="tts" value="gemini-2.5-flash-preview-tts">
  <small>Voce iOS (riserva)</small>
  <select id="voice"></select>
  <small>Tono (grave - acuto)</small>
  <input id="pitch" type="range" min="0.5" max="1.5" step="0.1" value="1">
  <small>Velocita'</small>
  <input id="rate" type="range" min="0.6" max="1.4" step="0.1" value="1">
  <button id="preset">Voce Jarvis</button>
  <button id="test">Prova voce</button>
  <button id="save">Salva</button>
</div>

<div id="log"></div>

<div id="bar">
  <button id="ear" title="Sempre in ascolto">👂</button>
  <button id="mic">🎤</button>
  <input id="txt" placeholder="Scrivi o parla...">
  <button id="send">▶</button>
  <button id="gear">⚙</button>
</div>

<script>
const $ = id => document.getElementById(id);
const SYSTEM = "Sei Jarvis, l'assistente personale di un utente italiano, in stile Iron Man: educato, spiritoso, efficiente. Rispondi sempre in italiano, in modo breve (massimo 3 frasi, fino a 5 per le notizie) perche' le risposte vengono lette ad alta voce. Chiamalo 'signore'. Non usare markdown, asterischi ne' elenchi. Se nel messaggio trovi dati meteo reali tra parentesi quadre, usali per rispondere in modo naturale (temperatura, condizioni, eventuale pioggia, un consiglio utile). Se i dati dicono che la posizione non e' disponibile, di' di consentire la posizione a Safari per questo sito. Se trovi titoli di notizie tra parentesi quadre, riassumi le piu' importanti in modo chiaro e neutrale, senza inventare nulla. Se trovi un estratto di Wikipedia tra parentesi quadre, usalo per rispondere in al massimo 4 frasi; se non e' pertinente, ignoralo e rispondi con le tue conoscenze. Se ti viene chiesto un briefing, saluta, di' l'ora, poi meteo e notizie, in modo molto sintetico.";
let history = [];

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} }
$('key').value = store('jarvis_key') || '';
$('model').value = store('jarvis_model') || 'gemini-2.5-flash-lite';
if (!$('key').value) $('cfg').style.display = 'block';

$('gear').onclick = () => { $('cfg').style.display = $('cfg').style.display === 'block' ? 'none' : 'block'; };
$('save').onclick = () => { store('jarvis_key', $('key').value.trim()); store('jarvis_model', $('model').value.trim()); $('cfg').style.display = 'none'; status('Impostazioni salvate'); };

function status(t) { $('status').textContent = t; }
function add(cls, t) { const d = document.createElement('div'); d.className = cls; d.textContent = t; $('log').appendChild(d); $('log').scrollTop = 1e9; }

/* ---------- Voce in uscita ---------- */
let speaking = false, lastSpoke = 0;
function itVoices() { return speechSynthesis.getVoices().filter(v => v.lang.replace('_', '-').startsWith('it')); }
function bestVoice(vs) {
  const male = vs.filter(v => /luca|cosimo/i.test(v.name));
  return male.find(v => /premium|enhanced|avanzat|migliorat/i.test(v.name)) || male[0] || vs[0];
}
function loadVoices() {
  const vs = itVoices();
  const sel = $('voice'); const saved = store('jarvis_voice');
  sel.innerHTML = '';
  vs.forEach(v => { const o = document.createElement('option'); o.value = v.name; o.textContent = v.name; sel.appendChild(o); });
  if (saved && vs.some(v => v.name === saved)) sel.value = saved;
  else if (vs.length) sel.value = bestVoice(vs).name;
}
try { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); } catch (e) {}
$('pitch').value = store('jarvis_pitch') || 0.85;
$('rate').value = store('jarvis_rate') || 0.92;
['voice', 'pitch', 'rate'].forEach(id => $(id).onchange = () => store('jarvis_' + id, $(id).value));
$('test').onclick = () => speak('Sono qui, signore. Tutti i sistemi sono operativi.', true);
$('preset').onclick = () => {
  const vs = itVoices(); if (vs.length) $('voice').value = bestVoice(vs).name;
  $('pitch').value = 0.8; $('rate').value = 0.92;
  ['voice', 'pitch', 'rate'].forEach(id => store('jarvis_' + id, $(id).value));
  speak('Buonasera, signore. Sono Jarvis, a sua disposizione.', true);
};
$('engine').value = store('jarvis_engine') || 'browser';
$('gvoice').value = store('jarvis_gvoice') || 'Charon';
$('tts').value = store('jarvis_tts') || 'gemini-2.5-flash-preview-tts';
['engine', 'gvoice', 'tts'].forEach(id => $(id).onchange = () => store('jarvis_' + id, $(id).value.trim()));

function browserSpeak(t) {
  try {
    if (!t.trim()) { const z = new SpeechSynthesisUtterance('.'); z.volume = 0; speechSynthesis.speak(z); return; }
    if (speechSynthesis.speaking) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'it-IT'; u.volume = 1;
    u.pitch = parseFloat($('pitch').value) || 1;
    u.rate = parseFloat($('rate').value) || 1;
    const all = speechSynthesis.getVoices();
    const v = all.find(x => x.name === $('voice').value) || all.find(x => x.lang.replace('_', '-').startsWith('it'));
    if (v) u.voice = v;
    speaking = true;
    u.onend = u.onerror = () => { speaking = false; lastSpoke = Date.now(); $('orb').classList.remove('busy'); status(earOn ? 'In ascolto: di\u2019 "Jarvis"' : 'Pronto'); };
    setTimeout(() => speechSynthesis.speak(u), 100);
  } catch (e) { speaking = false; }
}

let audioCtx = null, currentSrc = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const b = audioCtx.createBuffer(1, 1, 22050), src = audioCtx.createBufferSource();
    src.buffer = b; src.connect(audioCtx.destination); src.start(0);
  } catch (e) {}
}
function speakDone() {
  speaking = false; lastSpoke = Date.now(); $('orb').classList.remove('busy');
  status(earOn ? 'In ascolto: di\u2019 "Jarvis"' : 'Pronto');
}
async function geminiSpeak(t) {
  const key = $('key').value.trim();
  if (!key) throw new Error('manca la chiave');
  if (!audioCtx) throw new Error('audio non sbloccato: tocca un pulsante e riprova');
  try { if (currentSrc) currentSrc.stop(); } catch (e) {}
  speaking = true; status('Preparo la voce...');
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + $('tts').value.trim() + ':generateContent?key=' + encodeURIComponent(key);
  const r = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: 'Leggi in italiano con voce maschile calma, elegante e sicura, come un maggiordomo britannico: ' + t }] }],
      generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: $('gvoice').value } } } }
    })
  });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
  const part = j.candidates[0].content.parts.find(p => p.inlineData);
  if (!part) throw new Error('nessun audio ricevuto');
  const rate = parseInt((part.inlineData.mimeType.match(/rate=(\d+)/) || [])[1]) || 24000;
  const bin = atob(part.inlineData.data), n = Math.floor(bin.length / 2);
  const buf = audioCtx.createBuffer(1, n, rate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) {
    let v = (bin.charCodeAt(2 * i + 1) << 8) | bin.charCodeAt(2 * i);
    if (v >= 32768) v -= 65536;
    ch[i] = v / 32768;
  }
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.connect(audioCtx.destination);
  src.onended = speakDone; currentSrc = src;
  status('Parlo...'); src.start();
}
function speak(t, verbose) {
  if (!t.trim()) { unlockAudio(); browserSpeak(' '); return; }
  if ($('engine').value === 'gemini') {
    geminiSpeak(t).catch(e => {
      speaking = false;
      if (verbose) add('ai', 'Voce Gemini non disponibile (' + e.message + '). Uso la voce di iOS.');
      browserSpeak(t);
    });
  } else browserSpeak(t);
}

/* ---------- Meteo (Open-Meteo, gratis, senza chiave) ---------- */
const WMO = c => c === 0 ? 'sereno' : c === 1 ? 'prevalentemente sereno' : c === 2 ? 'parzialmente nuvoloso' : c === 3 ? 'coperto'
  : (c === 45 || c === 48) ? 'nebbia' : (c >= 51 && c <= 57) ? 'pioviggine' : (c >= 61 && c <= 67) ? 'pioggia'
  : (c >= 71 && c <= 77) ? 'neve' : (c >= 80 && c <= 82) ? 'rovesci' : (c === 85 || c === 86) ? 'rovesci di neve'
  : (c >= 95) ? 'temporale' : 'variabile';
const METEO_RE = /\b(meteo|piove|pioverà|piovera|pioggia|temperatura|previsioni|che tempo|quanti gradi|fa caldo|fa freddo|ombrello|nevica)\b/i;

async function getWeather() {
  try {
    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 10000, maximumAge: 600000 }));
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    let luogo = 'posizione attuale';
    try {
      const g = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=it');
      const gj = await g.json(); luogo = gj.city || gj.locality || luogo;
    } catch (e) {}
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=3';
    const r = await fetch(url); const j = await r.json();
    return JSON.stringify({
      luogo,
      adesso: { temperatura_C: j.current.temperature_2m, percepita_C: j.current.apparent_temperature,
                condizione: WMO(j.current.weather_code), vento_kmh: j.current.wind_speed_10m, pioggia_mm: j.current.precipitation },
      prossimi_giorni: j.daily.time.map((d, i) => ({ data: d, condizione: WMO(j.daily.weather_code[i]),
                min_C: j.daily.temperature_2m_min[i], max_C: j.daily.temperature_2m_max[i], prob_pioggia_pct: j.daily.precipitation_probability_max[i] }))
    });
  } catch (e) {
    return JSON.stringify({ errore: 'posizione o meteo non disponibili' });
  }
}

const TIME_RE = /\b(che ore sono|che ora|che giorno|data di oggi|che data)/i;
const NEWS_RE = /\b(notizie|news|telegiornale|ultime notizie|cosa succede nel mondo|accade nel mondo)/i;
const BRIEF_RE = /\b(briefing|riepilogo|resoconto)/i;

function timeText() {
  const d = new Date();
  return 'Sono le ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) + ' di ' +
    d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + '.';
}
function greeting() {
  const h = new Date().getHours();
  const s = h >= 5 && h < 13 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera';
  return s + ', signore. ' + timeText();
}
let greeted = false;

async function getNews() {
  try {
    const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://www.ansa.it/sito/notizie/mondo/mondo_rss.xml'));
    const j = await r.json();
    if (!j.items || !j.items.length) throw new Error('vuoto');
    return JSON.stringify(j.items.slice(0, 10).map(i => i.title));
  } catch (e) { return null; }
}

const YT_RE = /youtube/i;
const YT_CMD = /(apri|aprimi|avvia|metti|mettimi|cerca|cercami|riproduci|guarda|fammi vedere|vai)/i;
const WIKI_RE = /(wikipedia|\bchi (è|era)|\bche cos.è|\bcos.è|\bcos.era|\bparlami di|\bdimmi qualcosa su)/i;

function addLink(label, url) {
  const d = document.createElement('div'); d.className = 'ai';
  const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.className = 'lnk'; a.textContent = label;
  d.appendChild(a); $('log').appendChild(d); $('log').scrollTop = 1e9;
}
function ytQuery(text) {
  return text.replace(/\b(jarvis|per favore|per piacere)\b/ig, ' ')
    .replace(/\b(su|in|nel|sul|con)?\s*youtube\b/ig, ' ')
    .replace(/\b(apri|aprimi|avvia|metti|mettimi|cerca|cercami|riproduci|guarda|fammi vedere|vai)\b/ig, ' ')
    .replace(/[?!.,]/g, ' ').replace(/\s+/g, ' ').trim();
}
function wikiQuery(text) {
  return text.replace(/\b(jarvis|per favore|per piacere)\b/ig, ' ')
    .replace(/(cerca su wikipedia|su wikipedia|wikipedia|che cosa è|che cos.è|cosa è|cos.è|cos.era|chi è|chi era|chi e'|parlami di|dimmi qualcosa su|dimmi di|cerca|cercami|apri|aprimi|avvia|vai su|vai)/ig, ' ')
    .replace(/[?!.,]/g, ' ').replace(/\s+/g, ' ').trim();
}
async function getWiki(q) {
  try {
    const u = 'https://it.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=' + encodeURIComponent(q) +
      '&gsrlimit=1&prop=extracts|info&exintro=1&explaintext=1&exchars=1500&inprop=url&format=json&origin=*';
    const j = await (await fetch(u)).json();
    const p = Object.values(j.query.pages)[0];
    return { titolo: p.title, testo: p.extract, url: p.fullurl };
  } catch (e) { return null; }
}

/* ---------- Domanda a Gemini ---------- */
async function ask(text) {
  text = text.trim(); if (!text) return;
  const key = $('key').value.trim();
  if (!key) { $('cfg').style.display = 'block'; status('Inserisci la chiave API'); return; }
  add('me', text); $('txt').value = '';
  if (TIME_RE.test(text) && !BRIEF_RE.test(text)) { const o = timeText(); add('ai', o); status('Parlo...'); speak(o); return; }
  if (YT_RE.test(text) && YT_CMD.test(text)) {
    const q = ytQuery(text);
    const url = q ? 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q) : 'https://www.youtube.com/';
    const o = q ? 'Cerco ' + q + ' su YouTube, signore.' : 'Apro YouTube, signore.';
    add('ai', o); addLink(q ? 'Apri la ricerca su YouTube' : 'Apri YouTube', url); status('Parlo...'); speak(o);
    setTimeout(() => { try { window.open(url, '_blank'); } catch (e) {} }, 2500);
    return;
  }
  if (/wikipedia/i.test(text) && !wikiQuery(text)) {
    const o = 'Apro Wikipedia, signore.';
    add('ai', o); addLink('Apri Wikipedia', 'https://it.wikipedia.org/'); status('Parlo...'); speak(o);
    return;
  }
  $('orb').classList.add('busy'); status('Penso...');
  let content = text;
  let wikiUrl = null;
  let useSearch = false;
  if (WIKI_RE.test(text)) {
    const q = wikiQuery(text);
    if (q) {
      status('Cerco su Wikipedia...');
      const w = await getWiki(q);
      if (w && w.testo) { content += '\n[Wikipedia: ' + JSON.stringify({ titolo: w.titolo, testo: w.testo }) + ']'; wikiUrl = w.url; }
    }
  }
  const brief = BRIEF_RE.test(text);
  if (brief) content += '\n[Ora attuale: ' + timeText() + ']';
  if (brief || METEO_RE.test(text)) { status('Controllo il meteo...'); content += '\n[Dati meteo reali: ' + await getWeather() + ']'; }
  if (brief || NEWS_RE.test(text)) {
    status('Cerco le notizie...');
    const n = await getNews();
    if (n) content += '\n[Titoli reali di oggi dal mondo (ANSA): ' + n + ']';
    else { useSearch = true; content += '\n[Usa la ricerca Google per trovare le notizie piu importanti di oggi dal mondo]'; }
  }
  history.push({ role: 'user', parts: [{ text: content }] });
  try {
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + $('model').value.trim() + ':generateContent?key=' + encodeURIComponent(key);
    const r = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ systemInstruction: { parts: [{ text: SYSTEM }] }, contents: history.slice(-20) }, useSearch ? { tools: [{ google_search: {} }] } : {}))
    });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
    const out = j.candidates[0].content.parts.map(p => p.text || '').join('').trim();
    history.push({ role: 'model', parts: [{ text: out }] });
    add('ai', out); status('Parlo...'); speak(out);
    if (wikiUrl) addLink('Leggi su Wikipedia', wikiUrl);
  } catch (e) {
    history.pop(); $('orb').classList.remove('busy');
    add('ai', 'Errore: ' + e.message); status('Errore');
  }
}

$('send').onclick = () => { speak(' '); ask($('txt').value); };
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter') $('send').onclick(); });

/* ---------- Riconoscimento vocale ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

// Microfono singolo (tocca e parla)
let rec = null;
$('mic').onclick = () => {
  speak(' ');
  if (!SR) { status('Riconoscimento vocale non supportato: scrivi'); return; }
  if (earOn) stopEar();
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'it-IT'; rec.interimResults = false;
  rec.onstart = () => { $('mic').classList.add('on'); status('Ti ascolto...'); };
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.onerror = e => status('Microfono: ' + e.error);
  rec.onend = () => { $('mic').classList.remove('on'); rec = null; };
  rec.start();
};

// Parola di attivazione "Jarvis"
const WAKE = /(jarvis|giarvis|garvis|jervis|gervis|giarves|jarves)/i;
let earOn = false, ear = null, awakeUntil = 0;

function startEar() {
  if (!SR) { status('Riconoscimento vocale non supportato'); return; }
  speak(' ');
  if (!greeted) { greeted = true; setTimeout(() => speak(greeting()), 150); }
  earOn = true; $('ear').classList.add('on'); $('orb').classList.add('listen');
  status('In ascolto: di\u2019 "Jarvis"');
  listenLoop();
}
function stopEar() {
  earOn = false; $('ear').classList.remove('on'); $('orb').classList.remove('listen');
  try { ear && ear.stop(); } catch (e) {} ear = null; status('Pronto');
}
function listenLoop() {
  if (!earOn || ear) return;
  ear = new SR(); ear.lang = 'it-IT'; ear.continuous = true; ear.interimResults = false;
  ear.onresult = e => {
    const t = e.results[e.results.length - 1][0].transcript.trim();
    if (speaking || Date.now() - lastSpoke < 1000) return;   // ignora la voce di Jarvis
    const m = t.match(WAKE);
    if (m) {
      const cmd = t.slice(m.index + m[0].length).replace(/^[\s,.:;!?-]+/, '');
      if (cmd.length > 2) { awakeUntil = 0; ask(cmd); }
      else { awakeUntil = Date.now() + 10000; add('ai', 'Sono qui, signore.'); status('Sono qui...'); speak('Sono qui, signore.'); }
    } else if (Date.now() < awakeUntil) {
      awakeUntil = 0; ask(t);
    }
  };
  ear.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { stopEar(); status('Permesso microfono negato'); }
  };
  ear.onend = () => { ear = null; if (earOn) setTimeout(listenLoop, 400); };
  try { ear.start(); } catch (e) { ear = null; setTimeout(listenLoop, 1000); }
}
$('ear').onclick = () => { earOn ? stopEar() : startEar(); };
add('ai', greeting());

/* ---------- Grafica animata di Jarvis ---------- */
(function () {
  const cv = $('orb'), g = cv.getContext('2d');
  let W = 0, H = 0;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize(); window.addEventListener('resize', resize);
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const P = [];
  for (let i = 0; i < 70; i++) P.push({ a: Math.random() * 6.283, r: 0.5 + Math.random() * 1.1, s: (Math.random() - 0.5) * 0.012, ph: Math.random() * 20, z: 0.5 + Math.random() });
  let t = 0, energy = 0.15, hue = 190, ah = 190, tk = 0;
  const TAU = Math.PI * 2;
  let style = store('jarvis_style') || 'circle';
  $('gstyle').value = style;
  const bat = { pct: null, chg: false, at: null };
  try {
    const q = new URLSearchParams(location.search);
    if (q.has('bat')) {
      let v = parseFloat(q.get('bat'));
      if (v > 0 && v <= 1) v *= 100;
      if (v >= 0 && v <= 100) store('jarvis_bat', JSON.stringify({ p: Math.round(v), c: q.get('chg') === '1', t: Date.now() }));
    }
    const sv = JSON.parse(store('jarvis_bat') || 'null');
    if (sv) { bat.pct = sv.p; bat.chg = sv.c; bat.at = sv.t; }
  } catch (e) {}
  try {
    if (navigator.getBattery) navigator.getBattery().then(b => {
      const u = () => { bat.pct = Math.round(b.level * 100); bat.chg = b.charging; bat.at = null; };
      u(); b.addEventListener('levelchange', u); b.addEventListener('chargingchange', u);
    });
  } catch (e) {}
  let hudW = null, wStarted = false;
  async function refreshHudWeather() {
    try { const j = JSON.parse(await getWeather()); if (j.adesso) hudW = { t: Math.round(j.adesso.temperatura_C), c: j.adesso.condizione }; } catch (e) {}
  }
  function maybeWeather() {
    if (style === 'combo' && !wStarted) { wStarted = true; refreshHudWeather(); setInterval(refreshHudWeather, 900000); }
  }
  $('gstyle').onchange = () => { style = $('gstyle').value; store('jarvis_style', style); maybeWeather(); };
  document.addEventListener('click', maybeWeather);

  function drawHud(s) {
    const t = s.t, energy = s.energy, col = s.col, col2 = s.col2;
    const cx = W / 2, cy = H / 2 - 4, R = Math.min(H * 0.3, W * 0.2);
    const gl = g.createRadialGradient(cx, cy, 0, cx, cy, R * 1.8);
    gl.addColorStop(0, col(60, 0.18 + energy * 0.25)); gl.addColorStop(1, col(60, 0));
    g.fillStyle = gl; g.fillRect(0, 0, W, H);
    g.setLineDash([]); g.lineCap = 'butt'; g.strokeStyle = col(60, 0.8); g.lineWidth = 2;
    const b = 16, m = 4;
    [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(c => {
      g.beginPath(); g.moveTo(c[0], c[1] + c[3] * b); g.lineTo(c[0], c[1]); g.lineTo(c[0] + c[2] * b, c[1]); g.stroke();
    });
    g.beginPath(); g.arc(cx, cy, R * 1.2, 0, TAU);
    g.setLineDash([8, 6]); g.lineDashOffset = -t * (15 + energy * 60);
    g.strokeStyle = col(60, 0.85); g.lineWidth = 1.5; g.stroke(); g.setLineDash([]);
    for (let i = 0; i < 60; i++) {
      const a = i / 60 * TAU + t * 0.08, l = i % 5 === 0 ? 9 : 4;
      g.beginPath(); g.moveTo(cx + Math.cos(a) * R * 1.32, cy + Math.sin(a) * R * 1.32);
      g.lineTo(cx + Math.cos(a) * (R * 1.32 + l), cy + Math.sin(a) * (R * 1.32 + l));
      g.strokeStyle = col2(55, 0.55); g.lineWidth = 1; g.stroke();
    }
    g.lineCap = 'round';
    for (let k = 0; k < 2; k++) {
      const a0 = t * (0.7 + energy * 2) + k * Math.PI;
      g.beginPath(); g.arc(cx, cy, R, a0, a0 + 1.5); g.strokeStyle = col(65, 0.95); g.lineWidth = 4; g.stroke();
      const a1 = -t * (1.1 + energy * 2.5) + k * Math.PI;
      g.beginPath(); g.arc(cx, cy, R * 0.62, a1, a1 + 1.1); g.strokeStyle = col2(70, 0.95); g.lineWidth = 3; g.stroke();
    }
    g.lineCap = 'butt'; g.strokeStyle = col(60, 0.5); g.lineWidth = 1;
    [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(d => {
      g.beginPath(); g.moveTo(cx + d[0] * R * 0.3, cy + d[1] * R * 0.3); g.lineTo(cx + d[0] * R * 0.46, cy + d[1] * R * 0.46); g.stroke();
    });
    const cr = R * 0.2 * (1 + 0.08 * Math.sin(t * 3) + energy * 0.2 * Math.sin(t * 9));
    const core = g.createRadialGradient(cx, cy, 0, cx, cy, cr * 1.8);
    core.addColorStop(0, 'rgba(255,255,255,0.95)'); core.addColorStop(0.4, col2(62, 0.9)); core.addColorStop(1, col(50, 0));
    g.beginPath(); g.arc(cx, cy, cr * 1.8, 0, TAU); g.fillStyle = core; g.fill();

    const d = new Date();
    const hh = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    const dd = d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
    const st = s.talk ? 'Parlo' : s.busy ? 'Penso' : s.listen ? 'Ascolto' : 'Pronto';
    const panels = [[8, 26, 'Ora', hh], [8, H - 78, 'Data', dd], [W - 82, 26, 'Stato', st], [W - 82, H - 78, 'Ascolto', s.listen ? 'Attivo' : 'Spento']];
    g.lineWidth = 1;
    panels.forEach(p => {
      g.strokeStyle = col(60, 0.7); g.strokeRect(p[0] + 0.5, p[1] + 0.5, 74, 50);
      g.fillStyle = col(65, 0.8); g.font = '11px ui-monospace, Menlo, monospace'; g.fillText(p[2], p[0] + 8, p[1] + 17);
      g.fillStyle = col2(65, 1); g.font = '16px ui-monospace, Menlo, monospace'; g.fillText(p[3], p[0] + 8, p[1] + 39);
    });
    g.beginPath();
    const x0 = 96, x1 = W - 96, yy = H - 14;
    for (let i = 0; i <= 60; i++) {
      const u = i / 60, x = x0 + (x1 - x0) * u;
      const amp = (2 + energy * 12) * Math.sin(u * Math.PI) * Math.sin(u * 22 + t * (4 + energy * 10));
      if (i === 0) g.moveTo(x, yy + amp); else g.lineTo(x, yy + amp);
    }
    g.strokeStyle = col2(65, 0.9); g.lineWidth = 1.5; g.stroke();
  }

  const NL = [4, 6, 6, 3];
  function drawNeural(s) {
    const t = s.t, energy = s.energy, col = s.col, col2 = s.col2, talk = s.talk, busy = s.busy;
    const pos = [];
    for (let l = 0; l < NL.length; l++) {
      pos[l] = [];
      for (let i = 0; i < NL[l]; i++) {
        pos[l].push([W * (0.1 + 0.8 * l / 3) + Math.sin(t * 0.6 + l * 2 + i) * 5, H * (0.14 + 0.72 * (i + 0.5) / NL[l]) + Math.cos(t * 0.5 + i * 1.7 + l) * 5]);
      }
    }
    const speed = talk ? 0.9 : busy ? 0.6 : 0.25;
    const f = ((t * speed) % 1.5) - 0.25;
    const br = (l, i) => {
      const u = pos[l][i][0] / W;
      let v = Math.exp(-Math.pow((u - f) / 0.12, 2));
      if (talk) v = Math.max(v, 0.5 + 0.5 * Math.sin(t * 8 + i * 1.3 + l));
      return Math.min(1, 0.12 + v * (0.5 + energy * 0.5));
    };
    g.setLineDash([]); g.lineCap = 'round';
    for (let l = 0; l < NL.length - 1; l++) {
      for (let a = 0; a < NL[l]; a++) {
        for (let c = 0; c < NL[l + 1]; c++) {
          const m = (br(l, a) + br(l + 1, c)) / 2;
          g.beginPath(); g.moveTo(pos[l][a][0], pos[l][a][1]); g.lineTo(pos[l + 1][c][0], pos[l + 1][c][1]);
          g.strokeStyle = m > 0.45 ? col2(65, 0.2 + m * 0.7) : col(60, 0.08 + m * 0.4);
          g.lineWidth = 0.6 + m * 1.8; g.stroke();
        }
      }
    }
    for (let l = 0; l < NL.length; l++) {
      for (let i = 0; i < NL[l]; i++) {
        const v = br(l, i), x = pos[l][i][0], y = pos[l][i][1];
        if (v > 0.45) {
          g.beginPath(); g.arc(x, y, 8 + v * 8, 0, TAU); g.strokeStyle = col2(65, v * 0.5); g.lineWidth = 1; g.stroke();
          g.beginPath(); g.arc(x, y, 4 + v * 5, 0, TAU); g.fillStyle = col2(62, 0.95); g.fill();
        } else {
          g.beginPath(); g.arc(x, y, 5, 0, TAU); g.fillStyle = 'rgba(4,26,36,0.9)'; g.fill();
          g.strokeStyle = col(60, 0.8); g.lineWidth = 1.2; g.stroke();
        }
      }
    }
  }

  function drawCombo(s) {
    const t = s.t, energy = s.energy, col = s.col, col2 = s.col2, talk = s.talk, busy = s.busy;
    const cx = W / 2, top = 78, bot = H - 34, cy = (top + bot) / 2 + 2, R = 34;
    g.setLineDash([]); g.lineCap = 'butt'; g.strokeStyle = col(60, 0.8); g.lineWidth = 2;
    const b = 14, m = 3;
    [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(c => {
      g.beginPath(); g.moveTo(c[0], c[1] + c[3] * b); g.lineTo(c[0], c[1]); g.lineTo(c[0] + c[2] * b, c[1]); g.stroke();
    });
    const xs = [W * 0.07, W * 0.2, W * 0.8, W * 0.93], cnt = [4, 5, 5, 3];
    const ny = (i, n) => top + (bot - top) * (i + 0.5) / n;
    const nodes = [];
    for (let l = 0; l < 4; l++) {
      nodes[l] = [];
      for (let i = 0; i < cnt[l]; i++) nodes[l].push([xs[l] + Math.sin(t * 0.6 + l * 2 + i) * 3, ny(i, cnt[l]) + Math.cos(t * 0.5 + i * 1.7 + l) * 3]);
    }
    const lp = [cx - R * 1.75, cy], rp = [cx + R * 1.75, cy];
    const speed = talk ? 0.9 : busy ? 0.6 : 0.25;
    const f = ((t * speed) % 1.5) - 0.25;
    const brX = (x, i, l) => {
      let v = Math.exp(-Math.pow((x / W - f) / 0.12, 2));
      if (talk) v = Math.max(v, 0.5 + 0.5 * Math.sin(t * 8 + i * 1.3 + l));
      return Math.min(1, 0.12 + v * (0.5 + energy * 0.5));
    };
    const line = (x1, y1, x2, y2, m2) => {
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
      g.strokeStyle = m2 > 0.45 ? col2(65, 0.2 + m2 * 0.7) : col(60, 0.08 + m2 * 0.4);
      g.lineWidth = 0.6 + m2 * 1.8; g.stroke();
    };
    g.lineCap = 'round';
    for (let a = 0; a < 4; a++) for (let c = 0; c < 5; c++) line(nodes[0][a][0], nodes[0][a][1], nodes[1][c][0], nodes[1][c][1], (brX(nodes[0][a][0], a, 0) + brX(nodes[1][c][0], c, 1)) / 2);
    for (let c = 0; c < 5; c++) line(nodes[1][c][0], nodes[1][c][1], lp[0], lp[1], (brX(nodes[1][c][0], c, 1) + brX(lp[0], 0, 1)) / 2);
    for (let c = 0; c < 5; c++) line(rp[0], rp[1], nodes[2][c][0], nodes[2][c][1], (brX(rp[0], 0, 2) + brX(nodes[2][c][0], c, 2)) / 2);
    for (let a = 0; a < 5; a++) for (let c = 0; c < 3; c++) line(nodes[2][a][0], nodes[2][a][1], nodes[3][c][0], nodes[3][c][1], (brX(nodes[2][a][0], a, 2) + brX(nodes[3][c][0], c, 3)) / 2);

    drawOrb(cx + Math.sin(t * 0.7) * 4, cy + Math.cos(t * 0.5) * 3, R, s);

    for (let l = 0; l < 4; l++) for (let i = 0; i < cnt[l]; i++) {
      const x = nodes[l][i][0], y = nodes[l][i][1], v = brX(x, i, l);
      if (v > 0.45) {
        g.beginPath(); g.arc(x, y, 7 + v * 6, 0, TAU); g.strokeStyle = col2(65, v * 0.5); g.lineWidth = 1; g.stroke();
        g.beginPath(); g.arc(x, y, 3.5 + v * 4, 0, TAU); g.fillStyle = col2(62, 0.95); g.fill();
      } else {
        g.beginPath(); g.arc(x, y, 4.5, 0, TAU); g.fillStyle = 'rgba(4,26,36,0.9)'; g.fill();
        g.strokeStyle = col(60, 0.8); g.lineWidth = 1.1; g.stroke();
      }
    }

    const w = hudW;
    const bv = bat.pct === null ? 'n/d' : bat.pct + '%';
    const bs = bat.pct === null ? 'non su iOS' : bat.at ? 'alle ' + new Date(bat.at).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) : (bat.chg ? 'in carica' : 'batteria');
    const panels = [
      [8, 8, 'Meteo', w ? w.t + ' °C' : '--', w ? String(w.c).slice(0, 11) : 'tocca 👂'],
      [W - 100, 8, 'Batteria', bv, bs]
    ];
    g.lineWidth = 1;
    panels.forEach(p => {
      g.strokeStyle = col(60, 0.7); g.strokeRect(p[0] + 0.5, p[1] + 0.5, 92, 56);
      g.fillStyle = col(65, 0.8); g.font = '11px ui-monospace, Menlo, monospace'; g.fillText(p[2], p[0] + 8, p[1] + 16);
      g.fillStyle = col2(65, 1); g.font = '17px ui-monospace, Menlo, monospace'; g.fillText(p[3], p[0] + 8, p[1] + 36);
      g.fillStyle = col(65, 0.7); g.font = '11px ui-monospace, Menlo, monospace'; g.fillText(p[4], p[0] + 8, p[1] + 50);
    });
    const d = new Date();
    const hh = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    const st = talk ? 'Parlo' : busy ? 'Penso' : s.listen ? 'Ascolto' : 'Pronto';
    g.textAlign = 'center';
    g.fillStyle = col2(65, 1); g.font = '16px ui-monospace, Menlo, monospace'; g.fillText(hh, cx, 30);
    g.fillStyle = col(65, 0.8); g.font = '11px ui-monospace, Menlo, monospace'; g.fillText(st, cx, 46);
    g.textAlign = 'start';
    g.beginPath();
    const x0 = cx - 70, x1 = cx + 70, yy = H - 14;
    for (let i = 0; i <= 50; i++) {
      const u = i / 50, x = x0 + (x1 - x0) * u;
      const amp = (1.5 + energy * 9) * Math.sin(u * Math.PI) * Math.sin(u * 20 + t * (4 + energy * 10));
      if (i === 0) g.moveTo(x, yy + amp); else g.lineTo(x, yy + amp);
    }
    g.strokeStyle = col2(65, 0.9); g.lineWidth = 1.5; g.stroke();
  }

  function drawOrb(x, y, R, s) {
    const t = s.t, energy = s.energy, talk = s.talk, busy = s.busy, listen = s.listen, col = s.col, col2 = s.col2;
    const glow = g.createRadialGradient(x, y, 0, x, y, R * 2);
    glow.addColorStop(0, col(60, 0.22 + energy * 0.3)); glow.addColorStop(1, col(60, 0));
    g.fillStyle = glow; g.fillRect(0, 0, W, H);

    if (listen || energy > 0.3) {
      for (let k = 0; k < 2; k++) {
        const ph = (t * 0.6 + k * 0.5) % 1;
        g.beginPath(); g.arc(x, y, R * (0.9 + ph * 1.0), 0, TAU);
        g.strokeStyle = col(65, (1 - ph) * 0.45); g.lineWidth = 1.5; g.setLineDash([]); g.stroke();
      }
    }

    const nb = 72;
    for (let i = 0; i < nb; i++) {
      const a = i / nb * TAU + t * 0.15;
      const n = Math.abs(Math.sin(i * 1.7 + t * 8) * Math.cos(i * 0.9 - t * 5));
      const len = 3 + energy * 20 * n + (talk ? 6 * n : 0);
      g.beginPath();
      g.moveTo(x + Math.cos(a) * R * 1.3, y + Math.sin(a) * R * 1.3);
      g.lineTo(x + Math.cos(a) * (R * 1.3 + len), y + Math.sin(a) * (R * 1.3 + len));
      g.strokeStyle = col2(70, 0.35 + energy * 0.5); g.lineWidth = 2; g.stroke();
    }

    g.beginPath(); g.arc(x, y, R, 0, TAU);
    g.setLineDash([10, 7]); g.lineDashOffset = -t * (20 + energy * 80);
    g.strokeStyle = col(60, 0.9); g.lineWidth = 2; g.stroke(); g.setLineDash([]);

    for (let k = 0; k < 3; k++) {
      const a0 = -t * (0.8 + energy * 2.2) + k * TAU / 3;
      const len = 0.7 + 0.35 * Math.sin(t * 1.3 + k * 2);
      g.beginPath(); g.arc(x, y, R * 0.78, a0, a0 + len);
      g.strokeStyle = col2(75, 0.95); g.lineWidth = 4; g.lineCap = 'round'; g.stroke();
    }

    for (let i = 0; i < 48; i++) {
      const a = i / 48 * TAU + t * 0.1;
      const l = i % 4 === 0 ? 10 : 5;
      g.beginPath();
      g.moveTo(x + Math.cos(a) * R * 1.12, y + Math.sin(a) * R * 1.12);
      g.lineTo(x + Math.cos(a) * (R * 1.12 + l), y + Math.sin(a) * (R * 1.12 + l));
      g.strokeStyle = col2(55, 0.5); g.lineWidth = 1; g.stroke();
    }

    if (busy && !talk) {
      const a0 = t * 5;
      g.beginPath(); g.arc(x, y, R * 0.95, a0, a0 + 1.3);
      g.strokeStyle = col(80, 0.95); g.lineWidth = 6; g.lineCap = 'round'; g.stroke();
    }

    for (const p of P) {
      p.a += p.s * (1 + energy * 4);
      const rr = R * p.r + Math.sin(t * 1.5 + p.ph) * 8 * p.z;
      const px = x + Math.cos(p.a) * rr, py = y + Math.sin(p.a) * rr * 0.8;
      g.beginPath(); g.arc(px, py, 1 + p.z * 1.2, 0, TAU);
      g.fillStyle = col2(75, 0.35 + 0.4 * Math.abs(Math.sin(t + p.ph))); g.fill();
    }

    const cr = R * 0.34 * (1 + 0.07 * Math.sin(t * 3) + energy * 0.18 * Math.sin(t * 9));
    const core = g.createRadialGradient(x, y, 0, x, y, cr * 1.6);
    core.addColorStop(0, 'rgba(255,255,255,0.95)'); core.addColorStop(0.4, col2(62, 0.9)); core.addColorStop(1, col(50, 0));
    g.beginPath(); g.arc(x, y, cr * 1.6, 0, TAU); g.fillStyle = core; g.fill();
  }

  function frame() {
    requestAnimationFrame(frame);
    if (document.hidden || !W) return;
    t += reduce ? 0.004 : 0.016;
    const busy = cv.classList.contains('busy'), listen = cv.classList.contains('listen');
    const talk = typeof speaking !== 'undefined' && speaking;
    const target = talk ? 1 : busy ? 0.7 : listen ? 0.4 : 0.15;
    energy += (target - energy) * 0.05;
    const th = talk ? 364 : busy ? 38 : 190;
    hue += (th - hue) * 0.08;
    ah += ((talk ? 406 : th) - ah) * 0.08;
    tk += ((talk ? 1 : 0) - tk) * 0.08;
    const col = (l, a) => 'hsla(' + hue.toFixed(0) + ',100%,' + (l * (1 - 0.3 * tk)).toFixed(0) + '%,' + a + ')';
    const col2 = (l, a) => 'hsla(' + ah.toFixed(0) + ',100%,' + (l * (1 - 0.12 * tk)).toFixed(0) + '%,' + a + ')';
    const R = Math.min(W, H) * 0.3;
    const x = W / 2 + Math.sin(t * 0.7) * W * 0.12 + Math.sin(t * 1.9 + 1) * W * 0.03;
    const y = H / 2 + Math.cos(t * 0.5) * H * 0.07 + Math.sin(t * 1.3) * H * 0.03;
    g.clearRect(0, 0, W, H);
    if (style !== 'circle') {
      (style === 'hud' ? drawHud : style === 'combo' ? drawCombo : drawNeural)({ t: t, energy: energy, talk: talk, busy: busy, listen: listen, col: col, col2: col2 });
      return;
    }

    drawOrb(x, y, R, { t: t, energy: energy, talk: talk, busy: busy, listen: listen, col: col, col2: col2 });
  }
  frame();
})();
